<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>
    
    <!-- 
      The sections inside meta is security restrictions limiting what can be done on the application 
      If any changes needs to be done, it can be adjusted here for this page.

      'unsafe-inline'; - this allows for css styling, without it we restrict css code. usual in react
      script-src 'self' - is from once self, to limit it from external sources.

      Debugging option (all requests that would be prohibited are logged to the console rather than inacted)
        - adjust http-equiv => http-equiv="Content-Security-Policy-Report-only"
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' ;"
      
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
